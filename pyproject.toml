[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lockless"
version = "0.1.0"
description = "Lock-free concurrent data structures and zero-copy DSP primitives for Python 3.10+"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Axiomantic" },
]
keywords = ["lock-free", "concurrency", "queue", "ring-buffer", "dsp", "ctrie", "skiplist", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cffi>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/lockless"]
artifacts = [
    "python/lockless/*.dylib",
    "python/lockless/*.so",
    "python/lockless/*.dll",
    "python/lockless/*.pyi",
    "python/lockless/py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]

[tool.mypy]
python_version = "3.10"
strict = true
